name: Frontend CI

on:
  push:
    branches: [develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci is intentionally not used here: this repo's lockfile has platform-specific optional
      # dependencies (e.g. @unrs/resolver-binding-wasm32-wasi's @emnapi/* deps) whose recorded set
      # varies by the npm version that last ran install, which trips npm ci's strict in-sync check
      # even when nothing meaningful changed. npm install is more forgiving of that drift.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint
