# ==========================================
# 공통
# ==========================================
spring:
  profiles:
    active: local

  # JPA 공통 설정
  jpa:
    open-in-view: false # DB 커넥션 고갈 방지
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100 # IN절 한 번에 가져오는 개수
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_SERVER}

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000       # 1시간
  refresh-token-expiration: 1209600000   # 14일

# 소셜 로그인 토큰 검증 설정
oauth:
  apple:
    client-id: ${APPLE_CLIENT_ID:} # Sign in with Apple Services ID/Bundle ID — 토큰 aud와 대조

# CORS 허용 오리진 — 쉼표로 구분해 여러 도메인 지정 가능. prod는 CORS_ALLOWED_ORIGINS로 반드시 재정의할 것
# (기본값은 로컬 Next.js dev 서버 포트).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: "health, info, metrics, prometheus"
  endpoint:
    health:
      show-details: always
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: desc
    operations-sorter: method
    disable-swagger-default-url: true
  api-docs:
    path: /docs
---
# ==========================================
# 로컬 개발
# ==========================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true
  h2:
    console:
      path: /h2-console
      enabled: true
  # 로컬은 엔티티 기반 자동 스키마 생성(ddl-auto: update)을 그대로 쓴다 — 마이그레이션 스크립트 대상은 prod뿐.
  flyway:
    enabled: false

logging:
  level:
    com.gy.smartorder: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

---
# ==========================================
# 운영 환경
# ==========================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  # V1__init.sql(baseline)부터 순차 적용. prod DB 스키마는 이제 여기서만 변경한다.
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: info
    com.gy.smartorder: info